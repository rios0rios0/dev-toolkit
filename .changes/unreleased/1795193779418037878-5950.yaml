kind: 'Security'
body: 'stopped sending a `GITLAB_TOKEN` or `GL_TOKEN` to gitlab.com when another variable names a self-managed GitLab server: through gitforge v4.8.0, semantic-release''s `GL_URL` and `GITLAB_URL`, glab''s `GITLAB_URI`, `GITLAB_API_HOST` and `GITLAB_REPO`, Lerna''s `GL_API_URL`, Terraform''s `GITLAB_BASE_URL` and a GitLab CI job''s `CI_SERVER_*` variables now count beside `GITLAB_HOST` and `GL_HOST`, so `dev repo clone` no longer sends such a server''s token to gitlab.com. The docs also no longer claim that glab cannot print a token: it has no `auth token` command'
time: '2026-11-20T16:56:19.417987037Z'
