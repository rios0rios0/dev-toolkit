kind: 'Fixed'
body: 'fixed `dev repo sync`, `dev repo prune`, `dev repo fork-sync`, `dev repo worktree`, and `dev gist sync` treating `main` as the default branch of repositories without `origin/HEAD`, and using a deleted branch after a remote renamed its default; the default branch is now detected per repository (the recorded `origin/HEAD` while its branch exists, then the remote itself, then `main` or `master` only when present), and a repository whose default branch cannot be determined is reported as failed instead of being synced or pruned against a guess'
