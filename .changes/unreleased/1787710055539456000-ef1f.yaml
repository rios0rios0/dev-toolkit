kind: 'Added'
body: 'added credential resolution through the provider''s own CLI, so an already authenticated `gh`, `az`, or `glab` covers the provider API calls and no second token has to be exported. Credentials now come from a `CredentialResolver` chain instead of a bare `os.Getenv`: the provider''s token environment variable first (an explicitly exported token still wins), then `gh auth token`, `az account get-access-token` scoped to the Azure DevOps resource, or `glab auth token`. Codeberg has no widely installed official CLI and stays environment-only. When nothing can authenticate, the error now names every option rather than only the first one that failed. Cloning and syncing were already over SSH, so `dev repo clone` on a machine with SSH keys and `gh auth login` needs nothing else'
time: '2026-08-26T02:07:35.539456000Z'
